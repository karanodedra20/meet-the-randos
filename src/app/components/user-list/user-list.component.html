@if (users().length) {
<article class="user-list">
  <cdk-virtual-scroll-viewport [itemSize]="itemSize" class="viewport">
    <app-user-item
      *cdkVirtualFor="let user of users()"
      [user]="user"
      [nationalityCounts]="nationalityCounts()"
    />
  </cdk-virtual-scroll-viewport>
</article>
} @else {
<article class="user-list">
  <p>Loading…</p>
</article>
}
